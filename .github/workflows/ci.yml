name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 同一分支的新提交取消旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # optionalDependencies（pg / @electric-sql/pglite）默认会安装，
      # test:postgres 才能走内嵌 PGlite 跑通
      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: find server.js src scripts \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Lint（ESLint）
        run: npm run lint

      - name: 格式检查（Prettier）
        run: npm run format:check

      - name: 测试（SQLite）
        run: npm test

      - name: 测试（PostgreSQL / 内嵌 PGlite）
        run: npm run test:postgres

  # 真实 PostgreSQL：验证清单说「判定以真实 PostgreSQL 为准」，
  # 内嵌 PGlite 只覆盖 mode==="pg" 的部分分支，这里补上真实 pg 驱动。
  postgres:
    name: 真实 PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gst
          POSTGRES_PASSWORD: gst
          POSTGRES_DB: gst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gst -d gst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # core 与 api 各自在 before() 里做破坏性重置，必须用独立库，否则互相污染
      - name: 创建两个独立测试库
        env:
          PGPASSWORD: gst
        run: |
          psql -h 127.0.0.1 -U gst -d gst -v ON_ERROR_STOP=1 -c "CREATE DATABASE gst_core;"
          psql -h 127.0.0.1 -U gst -d gst -v ON_ERROR_STOP=1 -c "CREATE DATABASE gst_api;"

      - name: 核心测试（真实 PostgreSQL）
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://gst:gst@127.0.0.1:5432/gst_core
        run: node --test tests/core.test.js

      - name: HTTP 集成测试（真实 PostgreSQL）
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://gst:gst@127.0.0.1:5432/gst_api
        run: node --test tests/api.test.js

      # 服务容器带不了证书，这里用 docker run 起一个带自签证书的 TLS 版 PostgreSQL
      - name: 启动 TLS 版 PostgreSQL
        run: |
          mkdir -p .ci-certs
          openssl req -new -x509 -days 1 -nodes -subj "/CN=127.0.0.1" \
            -out .ci-certs/server.crt -keyout .ci-certs/server.key
          # PostgreSQL 要求私钥不被 group/other 读，且属主为容器里的 postgres（alpine uid=70）
          chmod 644 .ci-certs/server.crt
          chmod 600 .ci-certs/server.key
          sudo chown 70:70 .ci-certs/server.crt .ci-certs/server.key
          docker run -d --name gst-pg-tls \
            -e POSTGRES_USER=gst -e POSTGRES_PASSWORD=gst -e POSTGRES_DB=gst \
            -v "$PWD/.ci-certs:/certs:ro" -p 5433:5432 \
            postgres:16-alpine \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          ready=""
          for i in $(seq 1 60); do
            # 必须带 -h 127.0.0.1 强制走 TCP：initdb 临时服务只在 unix socket 上监听，
            # 否则会在初始化完成前误判为 ready，随后连接被断（Connection terminated）
            if docker exec gst-pg-tls pg_isready -h 127.0.0.1 -p 5432 -U gst -d gst >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "TLS PG 未就绪，容器日志："
            docker logs gst-pg-tls 2>&1 | tail -40
            exit 1
          fi
          # 再做一次真实查询，确认正式服务已在 TCP 上服务
          for i in $(seq 1 30); do
            if docker exec gst-pg-tls psql -h 127.0.0.1 -p 5432 -U gst -d gst -tAc "select 1" >/dev/null 2>&1; then ready=2; break; fi
            sleep 1
          done
          if [ "$ready" != "2" ]; then
            echo "TLS PG TCP 查询未成功，容器日志："
            docker logs gst-pg-tls 2>&1 | tail -40
            exit 1
          fi
          echo "TLS PG ready"

      - name: 验证 PG SSL（require=加密 / disable=明文）
        env:
          DB_DRIVER: postgres
        run: |
          node scripts/verify-pg-ssl.mjs "postgres://gst:gst@127.0.0.1:5433/gst" require true
          node scripts/verify-pg-ssl.mjs "postgres://gst:gst@127.0.0.1:5433/gst" disable false

  # 前端冒烟：真实 Chrome 无头加载页面，断言无 JS 异常 / CSP 违规 / 资源失败
  frontend:
    name: 前端冒烟（Chrome）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: 前端冒烟测试
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test --test-concurrency=1 tests/frontend/*.test.js
