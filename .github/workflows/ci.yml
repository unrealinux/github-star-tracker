name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 同一分支的新提交取消旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # optionalDependencies（pg / @electric-sql/pglite）默认会安装，
      # test:postgres 才能走内嵌 PGlite 跑通
      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: find server.js src scripts \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Lint（ESLint）
        run: npm run lint

      - name: 格式检查（Prettier）
        run: npm run format:check

      - name: 测试（SQLite）
        run: npm test

      - name: 测试（PostgreSQL / 内嵌 PGlite）
        run: npm run test:postgres

  # 真实 PostgreSQL：验证清单说「判定以真实 PostgreSQL 为准」，
  # 内嵌 PGlite 只覆盖 mode==="pg" 的部分分支，这里补上真实 pg 驱动。
  postgres:
    name: 真实 PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gst
          POSTGRES_PASSWORD: gst
          POSTGRES_DB: gst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gst -d gst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # core 与 api 各自在 before() 里做破坏性重置，必须用独立库，否则互相污染
      - name: 创建两个独立测试库
        env:
          PGPASSWORD: gst
        run: |
          psql -h 127.0.0.1 -U gst -d gst -v ON_ERROR_STOP=1 -c "CREATE DATABASE gst_core;"
          psql -h 127.0.0.1 -U gst -d gst -v ON_ERROR_STOP=1 -c "CREATE DATABASE gst_api;"

      - name: 核心测试（真实 PostgreSQL）
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://gst:gst@127.0.0.1:5432/gst_core
        run: node --test tests/core.test.js

      - name: HTTP 集成测试（真实 PostgreSQL）
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://gst:gst@127.0.0.1:5432/gst_api
        run: node --test tests/api.test.js

  # 前端冒烟：真实 Chrome 无头加载页面，断言无 JS 异常 / CSP 违规 / 资源失败
  frontend:
    name: 前端冒烟（Chrome）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: 前端冒烟测试
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test tests/frontend.test.js
